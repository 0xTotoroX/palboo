name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: Run all supported macOS and toolchain combinations
        type: boolean
        default: true

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    with:
      ref: ${{ github.sha }}
      full: ${{ github.event_name == 'push' || inputs.full == true }}
