name: Reusable verification

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

permissions:
  contents: read

jobs:
  compatibility:
    name: macOS · minimum toolchain
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88.0'
          components: rustfmt, clippy

      - name: Install locked dependencies
        run: npm ci

      - name: Install browser runtime
        run: npx playwright install chromium

      - name: Verify source, Rust, web, lifecycle, and compatibility gates
        run: npm run verify

      - name: Verify embedded SVG Liquid Glass
        run: npm run test:glass

      - name: Preserve failure reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failure-reports-macos
          path: target/reports/
          if-no-files-found: ignore
          retention-days: 7
