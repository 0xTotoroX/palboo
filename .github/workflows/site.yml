name: Website

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Reviewed commit or tag to build
        required: true
        type: string
      publish:
        description: Publish the reviewed website to GitHub Pages
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: website-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Record source revision
        run: git rev-parse HEAD | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install browser runtime
        run: npx playwright install --with-deps chromium

      - name: Check source and website interactions
        run: |
          npm run audit:source
          npm run test:site

      - name: Build static website
        run: npm run build:site

      - name: Upload website only
        uses: actions/upload-pages-artifact@v5
        with:
          path: target/site

  deploy:
    if: inputs.publish == true
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Publish reviewed website
        id: deployment
        uses: actions/deploy-pages@v5
