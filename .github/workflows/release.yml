name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build for review
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      installer: ${{ steps.plan.outputs.installer }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: plan
        name: Validate version and reviewed release notes
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: node scripts/release-plan.mjs "$RELEASE_TAG"

  verify:
    needs: plan
    uses: ./.github/workflows/verify.yml
    with:
      ref: ${{ inputs.tag || github.ref }}
      full: true

  prepare:
    needs: [plan, verify]
    permissions:
      contents: write
    name: Package for review
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        if: needs.plan.outputs.installer == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install locked dependencies
        if: needs.plan.outputs.installer == 'true'
        run: npm ci

      - name: Build and verify the complete App DMG
        if: needs.plan.outputs.installer == 'true'
        run: npm run package

      - name: Create a release draft for review
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          INSTALLER: ${{ needs.plan.outputs.installer }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          notes=".github/release-notes/$RELEASE_TAG.md"
          node scripts/release-plan.mjs "$RELEASE_TAG"
          create=(release create "$RELEASE_TAG" --verify-tag --draft --title "Palboo $RELEASE_TAG" --notes-file "$notes")
          if [ "$INSTALLER" = true ]; then
            asset="dist/palboo-$version-darwin-arm64.dmg"
            test -s "$asset"
            create+=("$asset")
          fi
          if [ "$PRERELEASE" = true ]; then
            create+=(--prerelease)
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite published assets.' >&2
            exit 1
          fi
          gh "${create[@]}"
          echo "Release draft is ready for maintainer review. Publish only after explicit approval."

      - name: Preserve release reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-failure-reports-${{ inputs.tag || github.ref_name }}
          path: target/reports/
          if-no-files-found: ignore
          retention-days: 7
